name: Update Space Shooter Game

on:
  schedule:
    - cron: "0 17 * * *" # 00:00 WIB
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2 # needed so the action can amend its previous commit
      - uses: czl9707/gh-space-shooter@v2.0.5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: "space-shooter.gif"
          strategy: "random"
